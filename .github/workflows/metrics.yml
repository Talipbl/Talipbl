name: GitHub Metrics

on:
  schedule:
    - cron: "0 3 * * *"   # Her gün 06:00 (İstanbul) civarı günceller
  workflow_dispatch:      # Actions sekmesinden elle çalıştırmak için
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Talipbl
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Istanbul
          config_display: large

          # En çok kullanılan diller
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # Katkı takvimi ve seri (streak)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
